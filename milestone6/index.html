<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />
    <title>ShopTCG</title>
  </head>

  <body>
    <header class="header">
      <div class="page-title">
        <h1 class="logo-text">ShopTCG</h1>
      </div>

      <!-- Hamburger toggle — hidden until the 768px breakpoint -->
      <button
        type="button"
        class="nav-toggle"
        aria-expanded="false"
        aria-controls="primary-nav-list"
      >
        <span class="visually-hidden">Menu</span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
      </button>

      <nav class="nav" aria-label="Main">
        <ul id="primary-nav-list" class="nav-list">
          <li class="nav-item">
            <a href="index.html" class="nav-link" aria-current="page">Home</a>
          </li>
          <li class="nav-item">
            <a href="" class="nav-link">Magic: The Gathering</a>
          </li>
          <li class="nav-item">
            <a href="" class="nav-link">Pokemon</a>
          </li>
          <li class="nav-item">
            <a href="" class="nav-link">Yu-Gi-Oh!</a>
          </li>
          <li class="nav-item"><a href="" class="nav-link">FAQ</a></li>
          <li class="nav-item">
            <a href="" class="nav-link">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="page">
      <main class="main">
        <section class="hero">
          <!-- Art-directed background: a taller/tighter crop is swapped in
               below 768px instead of hiding the image on small screens -->
          <picture>
            <source media="(max-width: 768px)" srcset="images/hero-mobile.jpg" />
            <img src="images/hero.jpg" alt="" class="hero-bg-img" decoding="async" />
          </picture>

          <div class="hero-text">
            <h2 id="hero-heading" class="hero-tagline">
              Here at ShopTCG we have <em>all</em> of your trading card needs!
              Whether it's Magic: The Gathering, Pokemon, or Yu-Gi-Oh!, we've
              got you covered.
            </h2>
          </div>

          <div class="hero-buttons">
            <button
              id="create-account-btn"
              class="btn btn-create-account"
              type="button"
            >
              Create Account
            </button>
            <button id="login-btn" class="btn btn-login" type="button">
              Login
            </button>
          </div>
        </section>

        <section class="card-section" aria-labelledby="card-section-heading">
          <h2 id="card-section-heading" class="visually-hidden">
            Browse by trading card game
          </h2>
          <div class="card-grid">
            <a href="" class="card-item" id="card-magic">
              <img
                src="images/mtg.jpg"
                alt="Magic: The Gathering card"
                class="card-img"
                decoding="async"
              />
            </a>

            <a href="" class="card-item" id="card-pokemon">
              <img
                src="images/pokemon.jpg"
                alt="Pokemon card"
                class="card-img"
                decoding="async"
              />
            </a>

            <a href="" class="card-item" id="card-yugioh">
              <img
                src="images/yugioh.jpg"
                alt="Yu-Gi-Oh card"
                class="card-img"
                decoding="async"
              />
            </a>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-content">
          <picture>
            <source
              media="(max-width: 768px)"
              srcset="images/footer-stock-mobile.jpg"
            />
            <img
              src="images/footer-stock.jpg"
              alt=""
              class="footer-image"
              width="320"
              height="180"
              decoding="async"
            />
          </picture>
          <p class="footer-copy">
            &copy; <time id="copyright-year" datetime="2026">2026</time>
            ShopTCG. All rights reserved.
          </p>
        </div>
      </footer>
    </div>

    <script>
      (function () {
        var yearEl = document.getElementById("copyright-year");
        if (yearEl) {
          var year = String(new Date().getFullYear());
          yearEl.textContent = year;
          yearEl.setAttribute("datetime", year);
        }

        var toggle = document.querySelector(".nav-toggle");
        var list = document.getElementById("primary-nav-list");
        if (!toggle || !list) return;

        toggle.addEventListener("click", function () {
          var isOpen = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!isOpen));
          list.classList.toggle("is-open", !isOpen);
        });

        list.querySelectorAll(".nav-link").forEach(function (link) {
          link.addEventListener("click", function () {
            toggle.setAttribute("aria-expanded", "false");
            list.classList.remove("is-open");
          });
        });
      })();
    </script>
  </body>
</html>
